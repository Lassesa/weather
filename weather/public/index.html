<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sääasema - Linnanmaa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800/80 backdrop-blur-md rounded-3xl p-6 border border-slate-700/50 shadow-2xl">
        
        <!-- Yläpalkki -->
        <div class="flex justify-between items-start mb-6">
            <div>
                <h1 class="text-2xl font-bold tracking-wide">Linnanmaa, Oulu</h1>
                <p id="time" class="text-xs text-slate-400 mt-1">Päivitetään...</p>
            </div>
            <div class="flex items-center gap-2">
                <!-- Kielivalitsin -->
                <div class="flex bg-slate-700/50 rounded-full p-0.5 text-[10px] font-bold border border-slate-600/50">
                    <button id="lang-fi" onclick="setLanguage('fi')" class="px-2 py-0.5 rounded-full bg-emerald-500 text-slate-900">FI</button>
                    <button id="lang-en" onclick="setLanguage('en')" class="px-2 py-0.5 rounded-full text-slate-400 hover:text-slate-200">EN</button>
                </div>
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    LIVE
                </span>
            </div>
        </div>

        <!-- Nykylämpötila -->
        <div class="text-center my-6">
            <div class="text-6xl font-extrabold tracking-tight my-2">
                <span id="tempnow">--</span><span class="text-emerald-400">°C</span>
            </div>
            <p id="lbl-curtemp" class="text-slate-400 text-sm">Nykylämpötila</p>
            
            <div class="flex justify-center gap-4 text-xs font-medium mt-3 text-slate-300">
                <span class="bg-slate-700/50 px-3 py-1 rounded-full"><span id="lbl-hi">Ylin</span>: <strong id="temphi">--</strong>°C</span>
                <span class="bg-slate-700/50 px-3 py-1 rounded-full"><span id="lbl-lo">Alin</span>: <strong id="templo">--</strong>°C</span>
            </div>
        </div>

        <!-- Säätietoruudukko -->
        <div class="grid grid-cols-2 gap-3 text-sm mb-6">
            <div class="bg-slate-700/30 p-3.5 rounded-2xl border border-slate-700/30 flex items-center gap-3">
                <i data-lucide="wind" class="text-emerald-400 w-6 h-6"></i>
                <div>
                    <div id="lbl-wind" class="text-xs text-slate-400">Tuulen nopeus</div>
                    <div class="font-semibold"><span id="windspeed">--</span> m/s</div>
                    <div class="text-[10px] text-slate-400"><span id="lbl-gust">Puuska</span>: <span id="windspeedmax">--</span> m/s</div>
                </div>
            </div>

            <div class="bg-slate-700/30 p-3.5 rounded-2xl border border-slate-700/30 flex items-center gap-3">
                <i data-lucide="droplets" class="text-blue-400 w-6 h-6"></i>
                <div>
                    <div id="lbl-hum" class="text-xs text-slate-400">Ilmankosteus</div>
                    <div class="font-semibold"><span id="humidity">--</span> %</div>
                    <div class="text-[10px] text-slate-400"><span id="lbl-dew">Kastepiste</span>: <span id="dewpoint">--</span>°C</div>
                </div>
            </div>

            <div class="bg-slate-700/30 p-3.5 rounded-2xl border border-slate-700/30 flex items-center gap-3">
                <i data-lucide="gauge" class="text-purple-400 w-6 h-6"></i>
                <div>
                    <div id="lbl-press" class="text-xs text-slate-400">Ilmanpaine</div>
                    <div class="font-semibold"><span id="airpressure">--</span> hPa</div>
                </div>
            </div>

            <div class="bg-slate-700/30 p-3.5 rounded-2xl border border-slate-700/30 flex items-center gap-3">
                <i data-lucide="cloud-rain" class="text-cyan-400 w-6 h-6"></i>
                <div>
                    <div id="lbl-rain" class="text-xs text-slate-400">Sade (tänään)</div>
                    <div class="font-semibold"><span id="precip_1d">--</span> mm</div>
                </div>
            </div>
        </div>

        <!-- Nappi graafiosiion avaamiseen -->
        <button id="toggle-history-btn" class="w-full py-2.5 px-4 bg-slate-700/50 hover:bg-slate-700 transition duration-200 text-xs font-semibold rounded-xl border border-slate-600/50 flex items-center justify-center gap-2">
            <i data-lucide="trending-up" class="w-4 h-4 text-emerald-400"></i>
            <span id="lbl-btn-graphs">Näytä graafit</span>
        </button>

        <!-- Graafiosio -->
        <div id="history-container" class="hidden mt-4 p-4 bg-slate-900/60 rounded-2xl border border-slate-700/50">
            
            <!-- Graafin valintanapit (Lämpötila / Tuuli / Kosteus) -->
            <div class="flex gap-1 mb-3 bg-slate-800 p-1 rounded-xl">
                <button onclick="setMetric('temp')" id="btn-temp" class="flex-1 py-1 text-xs font-semibold rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Lämpötila</button>
                <button onclick="setMetric('wind')" id="btn-wind" class="flex-1 py-1 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200">Tuuli</button>
                <button onclick="setMetric('hum')" id="btn-hum" class="flex-1 py-1 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200">Kosteus</button>
            </div>

            <!-- Aikaikkunan valinta (24h / 7d / Kaikki) -->
            <div class="flex justify-end gap-2 mb-2 text-[10px]">
                <button onclick="setRange('24h')" id="range-24h" class="text-emerald-400 font-bold">24h</button>
                <span class="text-slate-600">|</span>
                <button onclick="setRange('7d')" id="range-7d" class="text-slate-400 hover:text-slate-200"><span id="lbl-7d">7 vrk</span></button>
                <span class="text-slate-600">|</span>
                <button onclick="setRange('all')" id="range-all" class="text-slate-400 hover:text-slate-200"><span id="lbl-all">Kaikki</span></button>
            </div>

            <canvas id="weatherChart" class="w-full h-48"></canvas>
        </div>

    </div>

    <script>
        let myChart = null;
        let currentMetric = 'temp';
        let currentRange = '24h';
        let currentLang = 'fi';
        let cachedData = [];
        let rawTimeStr = '';

        const translations = {
            fi: {
                title: "Sääasema - Linnanmaa",
                updated: "Päivitetty: ",
                updating: "Päivitetään...",
                curTemp: "Nykylämpötila",
                hi: "Ylin",
                lo: "Alin",
                wind: "Tuulen nopeus",
                gust: "Puuska",
                hum: "Ilmankosteus",
                dew: "Kastepiste",
                press: "Ilmanpaine",
                rain: "Sade (tänään)",
                showGraphs: "Näytä graafit",
                hideGraphs: "Piilota graafit",
                metricTemp: "Lämpötila",
                metricWind: "Tuuli",
                metricHum: "Kosteus",
                range7d: "7 vrk",
                rangeAll: "Kaikki",
                chartTemp: "Lämpötila (°C)",
                chartWind: "Tuulen nopeus (m/s)",
                chartHum: "Ilmankosteus (%)",
                locale: "fi-FI"
            },
            en: {
                title: "Weather Station - Linnanmaa",
                updated: "Updated: ",
                updating: "Updating...",
                curTemp: "Current Temperature",
                hi: "High",
                lo: "Low",
                wind: "Wind Speed",
                gust: "Gust",
                hum: "Humidity",
                dew: "Dew Point",
                press: "Air Pressure",
                rain: "Rain (today)",
                showGraphs: "Show Graphs",
                hideGraphs: "Hide Graphs",
                metricTemp: "Temperature",
                metricWind: "Wind",
                metricHum: "Humidity",
                range7d: "7 days",
                rangeAll: "All",
                chartTemp: "Temperature (°C)",
                chartWind: "Wind Speed (m/s)",
                chartHum: "Humidity (%)",
                locale: "en-US"
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.getElementById('lang-fi').className = lang === 'fi' ? "px-2 py-0.5 rounded-full bg-emerald-500 text-slate-900" : "px-2 py-0.5 rounded-full text-slate-400 hover:text-slate-200";
            document.getElementById('lang-en').className = lang === 'en' ? "px-2 py-0.5 rounded-full bg-emerald-500 text-slate-900" : "px-2 py-0.5 rounded-full text-slate-400 hover:text-slate-200";

            document.getElementById('lbl-curtemp').innerText = t.curTemp;
            document.getElementById('lbl-hi').innerText = t.hi;
            document.getElementById('lbl-lo').innerText = t.lo;
            document.getElementById('lbl-wind').innerText = t.wind;
            document.getElementById('lbl-gust').innerText = t.gust;
            document.getElementById('lbl-hum').innerText = t.hum;
            document.getElementById('lbl-dew').innerText = t.dew;
            document.getElementById('lbl-press').innerText = t.press;
            document.getElementById('lbl-rain').innerText = t.rain;

            document.getElementById('btn-temp').innerText = t.metricTemp;
            document.getElementById('btn-wind').innerText = t.metricWind;
            document.getElementById('btn-hum').innerText = t.metricHum;
            document.getElementById('lbl-7d').innerText = t.range7d;
            document.getElementById('lbl-all').innerText = t.rangeAll;

            const historyContainer = document.getElementById('history-container');
            const isHidden = historyContainer.classList.contains('hidden');
            document.getElementById('lbl-btn-graphs').innerText = isHidden ? t.showGraphs : t.hideGraphs;

            if (rawTimeStr) updateTimeDisplay(rawTimeStr);
            renderChart();
        }

        function updateTimeDisplay(rawTime) {
            rawTimeStr = rawTime;
            const t = translations[currentLang];
            const formattedTimeStr = rawTime.trim().replace(' ', 'T').replace(' UTC', 'Z');
            const utcDate = new Date(formattedTimeStr);

            if (!isNaN(utcDate.getTime())) {
                const localTimeStr = utcDate.toLocaleString(t.locale, {
                    timeZone: 'Europe/Helsinki',
                    day: 'numeric', month: 'numeric', year: 'numeric',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
                document.getElementById('time').innerText = t.updated + localTimeStr;
            } else {
                document.getElementById('time').innerText = t.updated + rawTime;
            }
        }

        // --- 1. Sään hakeminen ---
        async function fetchWeather() {
            try {
                const response = await fetch('/api/weather');
                const xmlText = await response.text();
                
                const parser = new DOMParser();
                const xml = parser.parseFromString(xmlText, "text/xml");
                const getValue = (tag) => xml.querySelector(tag)?.textContent || '--';

                document.getElementById('tempnow').innerText = getValue('tempnow');
                document.getElementById('temphi').innerText = getValue('temphi');
                document.getElementById('templo').innerText = getValue('templo');
                document.getElementById('windspeed').innerText = getValue('windspeed');
                document.getElementById('windspeedmax').innerText = getValue('windspeedmax');
                document.getElementById('humidity').innerText = getValue('humidity');
                document.getElementById('dewpoint').innerText = getValue('dewpoint');
                document.getElementById('airpressure').innerText = getValue('airpressure');

                const precip1d = xml.querySelector('precipitation[time="1d"]')?.textContent || '0.0';
                document.getElementById('precip_1d').innerText = precip1d;

                updateTimeDisplay(getValue('time'));

                if (window.lucide) lucide.createIcons();

            } catch (error) {
                console.error("Virhe sään hakemisessa:", error);
            }
        }

        // --- 2. Graafidatan lataus ja piirto ---
        async function loadGraphData() {
            try {
                const response = await fetch(`/api/history?range=${currentRange}`);
                cachedData = await response.json();
                renderChart();
            } catch (error) {
                console.error("Virhe graafidatan latauksessa:", error);
            }
        }

        function renderChart() {
            if (!cachedData || cachedData.length === 0) return;

            const t = translations[currentLang];

            const labels = cachedData.map(item => {
                const d = new Date(item.timestamp);
                return currentRange === '24h' 
                    ? d.toLocaleTimeString(t.locale, { hour: '2-digit', minute: '2-digit' })
                    : d.toLocaleDateString(t.locale, { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
            });

            let dataPoints = [];
            let labelText = '';
            let color = '#34d399';

            if (currentMetric === 'temp') {
                dataPoints = cachedData.map(i => parseFloat(i.temperature));
                labelText = t.chartTemp;
                color = '#34d399';
            } else if (currentMetric === 'wind') {
                dataPoints = cachedData.map(i => parseFloat(i.windspeed));
                labelText = t.chartWind;
                color = '#38bdf8';
            } else if (currentMetric === 'hum') {
                dataPoints = cachedData.map(i => parseFloat(i.humidity));
                labelText = t.chartHum;
                color = '#a78bfa';
            }

            const ctx = document.getElementById('weatherChart').getContext('2d');

            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: labelText,
                        data: dataPoints,
                        borderColor: color,
                        backgroundColor: color + '1A',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointRadius: cachedData.length === 1 ? 4 : (currentRange === 'all' ? 0 : 2)
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#94a3b8', font: { size: 9 } }, grid: { color: 'rgba(51, 65, 85, 0.3)' } },
                        y: { ticks: { color: '#94a3b8', font: { size: 9 } }, grid: { color: 'rgba(51, 65, 85, 0.3)' } }
                    }
                }
            });
        }

        // --- 3. Interaktiot ja napit ---
        function setMetric(metric) {
            currentMetric = metric;
            
            ['temp', 'wind', 'hum'].forEach(m => {
                const btn = document.getElementById(`btn-${m}`);
                if (m === metric) {
                    btn.className = "flex-1 py-1 text-xs font-semibold rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                } else {
                    btn.className = "flex-1 py-1 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200";
                }
            });

            renderChart();
        }

        function setRange(range) {
            currentRange = range;
            
            ['24h', '7d', 'all'].forEach(r => {
                const btn = document.getElementById(`range-${r}`);
                if (r === range) {
                    btn.className = "text-emerald-400 font-bold";
                } else {
                    btn.className = "text-slate-400 hover:text-slate-200";
                }
            });

            loadGraphData();
        }

        const historyBtn = document.getElementById('toggle-history-btn');
        const historyContainer = document.getElementById('history-container');

        historyBtn.addEventListener('click', () => {
            const isHidden = historyContainer.classList.contains('hidden');
            const t = translations[currentLang];

            if (isHidden) {
                historyContainer.classList.remove('hidden');
                loadGraphData();
                document.getElementById('lbl-btn-graphs').textContent = t.hideGraphs;
            } else {
                historyContainer.classList.add('hidden');
                document.getElementById('lbl-btn-graphs').textContent = t.showGraphs;
            }
        });

        fetchWeather();
        setInterval(fetchWeather, 60000);
    </script>
</body>
</html>
